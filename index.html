<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Dye </title>
    <meta name="description" content="Style your terminal output with Dye.">
    
    <!-- OG -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mahdidevroom.github.io/dye-docs/">
    <meta property="og:title" content="Dye | Style your terminal output.">
    <meta property="og:description" content="A small, expressive API for colored and formatted terminal text. Write styles with readable markup or build them through the chainable Ink API.">
    <meta property="og:image" content="https://mahdidevroom.github.io/dye-docs/images/banner.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    
    <!-- 404 trick -->
    <script>
      (function() {
        var path = sessionStorage.getItem('redirectPath');
        if (path) {
          sessionStorage.removeItem('redirectPath');
          window.history.replaceState(null, null, path);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
